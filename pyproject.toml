[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexbot-dynid"
version = "0.3.1"
description = "Dexbot closed-chain lower-limb dynamic parameter identification"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.20", "scipy>=1.7"]

[project.optional-dependencies]
sdp = ["cvxpy>=1.3", "clarabel>=0.5"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
